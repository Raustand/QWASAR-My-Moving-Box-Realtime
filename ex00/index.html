<!DOCTYPE html>
<html>
    <body>
    <div
        id="my_box_realtime"
        style="background-color: red; position: absolute; right: 70px; bottom: 70px; min-width: 100px; min-height: 100px"
    ></div>
    <script type="text/javascript">
        const box = document.getElementById("my_box_realtime");
        let pos = 70;
        const timer = setInterval (()=> {
            if (pos <=0) {
                clearInterval(timer);
                return;
            }
            pos-= 1;
            box.style.right = pos + "px";
            box.style.bottom = pos + "px";

        }, 500)
    </script>

    </body>
</html>
